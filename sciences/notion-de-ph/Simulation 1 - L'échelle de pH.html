<style>
:root{--ink:#14202b;--fond:#F3FAFC;--turq:#00A5BF;--turq-l:#E0F6FA;--bleu:#1F6FB5;--acide:#C1121F;--neutre:#0B7A4B;--basique:#1F4FB4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--ink);font-family:"Source Sans 3","Segoe UI",sans-serif;font-size:18px;line-height:1.5}
.bandeau{background:linear-gradient(120deg,#E0F6FA 0%,#E9F1FF 55%,#FFF3DE 100%);border-bottom:3px solid var(--ink);padding:24px 28px 20px}
.bandeau p{margin:0;font-weight:700;color:#00778a;font-size:17px}
.bandeau h1 .badge{display:inline-block;vertical-align:.18em;margin-right:14px;background:#E8661B;color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:2px 16px;font-size:.5em;letter-spacing:0;box-shadow:0 4px 0 #F8C9A8}
.bandeau h1{margin:4px 0 0;font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.02em}
main{max-width:1320px;margin:0 auto;padding:22px 20px 26px}
.labo{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.produits{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px}
.produits h2{display:table;margin:0 auto 14px;background:var(--turq);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 22px;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;box-shadow:0 4px 0 #9BE3EE}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.carte{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--p,#fff);border:2.5px solid var(--ink);border-radius:16px;padding:8px 6px 9px;cursor:pointer;color:var(--ink);transition:transform .2s,box-shadow .2s}
.carte svg{width:52px;height:52px}
.carte span{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13.5px;line-height:1.15;text-align:center}
.carte:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--turq-l),0 0 0 3px var(--turq)}
.carte:focus-visible{outline:4px solid var(--turq);outline-offset:2px}
.carte:disabled{opacity:.5;cursor:not-allowed}
.carte.hors{display:none!important}
.carte.choisie{opacity:1;border-color:var(--turq);border-width:4px;box-shadow:0 0 0 3px var(--ink),0 12px 18px -10px rgba(20,32,43,.55);transform:translateY(-4px)}
.paillasse{background:#fff;border:3px solid var(--ink);border-radius:22px;overflow:hidden}
.message{--c:#FFC928;margin:16px 16px 14px;border:4px solid var(--c);border-radius:18px;background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#fff);padding:12px 18px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:68px;transition:background .4s,border-color .4s,box-shadow .4s}
.message .m-res{display:inline-flex;align-items:center;background:var(--acide);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:6px 18px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.message .m-res.neutre{background:var(--neutre)}.message .m-res.basique{background:var(--basique)}
.message .m-cons{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px}
svg.scene{display:block;width:100%;height:auto;border-top:3px solid var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
svg.scene .sg{fill:#CFEEC1}svg.scene .sg.on{fill:#0F3D24}
svg.scene .bt{cursor:pointer}
svg.scene .bt.dis{opacity:.4;cursor:not-allowed}
svg.scene .bt:not(.dis){animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
svg.scene .bt:focus-visible{outline:none}svg.scene .bt:focus-visible rect{stroke:var(--turq);stroke-width:5}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
svg.scene .sonde{cursor:pointer}
svg.scene .bar.tourne{animation:tourne .45s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tourne{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.18)}}
svg.scene .voy.on{fill:#22C55E}
svg.scene .bouton-ag{transition:transform .4s;transform-origin:370px 452px}
svg.scene .bul{animation:bul 2.4s linear infinite}
@keyframes bul{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
svg.scene .jet circle{animation:jet .45s linear infinite}
@keyframes jet{from{transform:translate(0,0)}to{transform:translate(-50px,4px)}}
svg.scene .gt{animation:gt .7s ease-in infinite}
@keyframes gt{from{transform:translateY(0);opacity:1}to{transform:translateY(110px);opacity:.2}}
svg.scene .rep-x{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
footer{border-top:3px solid var(--ink);padding:14px 20px 16px;display:flex;gap:16px;flex-wrap:wrap;font-weight:600;background:#fff}
@media (max-width:1000px){.labo{grid-template-columns:1fr}.grille{grid-template-columns:repeat(5,1fr)}}
@media (max-width:560px){.grille{grid-template-columns:repeat(3,1fr)}.message .m-cons{font-size:20px}.message .m-res{font-size:18px}.bandeau{padding:20px 16px}main{padding:16px 12px 20px}}
@media (prefers-reduced-motion:reduce){svg.scene .bt:not(.dis),svg.scene .bar.tourne,svg.scene .bul{animation:none}}
</style></head>

 // ---- vidage : le bécher se penche au-dessus du bidon
 var PIV=[606,156], CIBLE=[905,330], ANG=115;
 var COINS=[[394,168],[590,168],[590,400],[394,400]];
 function monde(p,a,t){var r=a*Math.PI/180,x=p[0]-PIV[0],y=p[1]-PIV[1];return [PIV[0]+t[0]+x*Math.cos(r)-y*Math.sin(r),PIV[1]+t[1]+x*Math.sin(r)+y*Math.cos(r)];}
 function local(p,a,t){var r=-a*Math.PI/180,x=p[0]-PIV[0]-t[0],y=p[1]-PIV[1]-t[1];return [PIV[0]+x*Math.cos(r)-y*Math.sin(r),PIV[1]+x*Math.sin(r)+y*Math.cos(r)];}
 function coupe(poly,W){ // partie du polygone sous la ligne y = W (y vers le bas)
  var out=[];for(var i=0;i<poly.length;i++){var a=poly[i],b=poly[(i+1)%poly.length],ia=a[1]>=W,ib=b[1]>=W;
   if(ia)out.push(a);if(ia!==ib){var k=(W-a[1])/(b[1]-a[1]);out.push([a[0]+k*(b[0]-a[0]),W]);}}return out;}
 function aire(p){var s=0;for(var i=0;i<p.length;i++){var a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
 function eau(poly,A){var lo=-2000,hi=2000;for(var n=0;n<50;n++){var m=(lo+hi)/2;if(aire(coupe(poly,m))>A)lo=m;else hi=m;}return coupe(poly,(lo+hi)/2);}
 // bascule le bécher au-dessus du bidon et verse tout son contenu, puis le remet en place
 function bascule(couleur,fin){
  var ordre=bech.nextSibling;svg.insertBefore(bech,pw);
  var vol=196*Math.max(0,400-niv);
  function filet(s){coule.setAttribute('stroke',couleur);coule.setAttribute('d','M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' Q'+(s[0]+6).toFixed(1)+' '+(s[1]+20).toFixed(1)+' '+(CIBLE[0]+12)+' 352');coule.setAttribute('opacity',1);}
  function dessine(a,t){
   var poly=COINS.map(function(c){return monde(c,a,t);});
   var cap=aire(coupe(poly,monde(PIV,a,t)[1]+1));
   var verse=vol>cap;if(verse)vol=cap;
   var w=vol>1?eau(poly,vol):[];
   if(w.length>2){liq.setAttribute('d','M'+w.map(function(p){var l=local(p,a,t);return l[0].toFixed(1)+' '+l[1].toFixed(1);}).join(' L')+' Z');}
   else liq.setAttribute('d','');
   surf.style.opacity=0;
   if(verse&&vol>1)filet(monde(PIV,a,t));else coule.setAttribute('opacity',0);
  }
  tween(900,function(k){var e=lisse(k),t=[(CIBLE[0]-PIV[0])*e,(CIBLE[1]-PIV[1])*e];bech.setAttribute('transform','translate('+t[0]+' '+t[1]+') rotate('+(ANG*e)+' '+PIV[0]+' '+PIV[1]+')');dessine(ANG*e,t);},function(){
   var t=[CIBLE[0]-PIV[0],CIBLE[1]-PIV[1]],v0=vol;
   tween(1100,function(k){vol=v0*(1-k);dessine(ANG,t);if(vol>1)filet(monde(PIV,ANG,t));},function(){
    coule.setAttribute('opacity',0);
    tween(900,function(k){var e=1-lisse(k),tt=[t[0]*e,t[1]*e];bech.setAttribute('transform','translate('+tt[0]+' '+tt[1]+') rotate('+(ANG*e)+' '+PIV[0]+' '+PIV[1]+')');},function(){
     bech.removeAttribute('transform');svg.insertBefore(bech,ordre);niveau(VIDE);fin();
    });
   });
  });
 }
