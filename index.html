<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les cours de 1CAP EPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color:#0d1a22;background:#f3f8fa;line-height:1.55}
a{color:inherit}
.bar{background:#fff;border-bottom:2.5px solid #22323b}
.bar .in{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.bar .lg{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;
  text-decoration:none}
.bar .fil{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .fil a{color:#00778a;font-weight:600}
.bar .qui{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
  font-size:14px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:30px 20px 60px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;
  letter-spacing:-.02em;margin:0 0 6px}
.kick{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#00778a;font-weight:700;margin:0 0 8px}
.sub{font-size:17px;margin:0 0 30px}
.carte{display:block;background:#fff;border:2.5px solid #22323b;border-radius:18px;
  padding:20px 24px;text-decoration:none;box-shadow:0 14px 30px -24px rgba(13,26,34,.7)}
.carte:hover{border-color:var(--c);box-shadow:0 18px 34px -22px rgba(13,26,34,.55)}
.carte h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
  margin:0 0 4px;color:var(--c)}
.carte p{margin:0;font-size:15.5px}
.gr{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;
  margin:0 0 34px}
.hero svg{width:100%;height:auto;max-width:100%;display:block}
.doc{background:#fff;border:2.5px solid #22323b;border-radius:18px;padding:22px 24px;
  margin:0 0 18px}
.doc h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;
  margin:0 0 6px;color:var(--c)}
.doc p{margin:0 0 16px;font-size:15.5px}
.bt{display:inline-flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:16px;text-decoration:none;color:#fff;background:var(--c);
  border-radius:12px;padding:11px 20px;margin:0 10px 10px 0}
.bt.sec{background:#fff;color:var(--c);border:2.5px solid var(--c)}
.bt:hover{filter:brightness(1.08)}
.vide{background:#fff;border:2.5px dashed #22323b;border-radius:18px;padding:20px 24px;
  font-size:15.5px}
footer.pied{border-top:2.5px solid #22323b;background:#fff}
footer.pied .in{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;
  flex-wrap:wrap;gap:6px 16px;align-items:center;
  font-family:"Bricolage Grotesque",sans-serif;font-size:14px}
footer.pied .sep{color:#00778a;font-weight:800}
footer.pied b{font-weight:800}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  h1{font-size:27px}
  .bar .qui{margin-left:0;width:100%}}
</style>
</head>
<body>
<header class="bar"><div class="in"><a class="lg" href="./index.html">1CAP EPC</a><nav class="fil"></nav><span class="qui">Mme Talbaut</span></div></header>
<main>
<div class="hero"><div><p class="kick">Lycée professionnel Max Joséphine</p><h1>Les cours de 1CAP EPC</h1><p class="sub">Les documents élève de l’année, à lire et à imprimer. Un élève absent retrouve ici le cours du jour.</p></div><div>
<svg viewBox="0 0 520 380" role="img" aria-label="Sciences et mathématiques">
  <defs>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fc4d8"/><stop offset="1" stop-color="#00778a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="520" height="380" rx="26" fill="#e4f2f6"/>
  <circle cx="416" cy="86" r="70" fill="#d7ecf2"/>
  <!-- becher -->
  <path d="M168 104 h104 v22 h-12 v58 l58 118 a26 26 0 0 1 -23 38 h-150
           a26 26 0 0 1 -23 -38 l58 -118 v-58 h-12 z"
        fill="#fff" stroke="#22323b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M141 252 h158 l25 50 a26 26 0 0 1 -23 38 h-162 a26 26 0 0 1 -23 -38 z"
        fill="url(#liq)"/>
  <path d="M168 104 h104 v22 h-104 z" fill="#22323b"/>
  <circle cx="182" cy="296" r="9" fill="#fff" opacity=".65"/>
  <circle cx="232" cy="282" r="6" fill="#fff" opacity=".55"/>
  <circle cx="266" cy="308" r="7" fill="#fff" opacity=".5"/>
  <!-- pictogramme losange -->
  <g transform="translate(416 86) rotate(45)">
    <rect x="-46" y="-46" width="92" height="92" rx="8" fill="#fff"
          stroke="#C1121F" stroke-width="10"/>
  </g>
  <g transform="translate(416 86)" fill="#22323b">
    <path d="M-4 -30 h8 l-2 34 h-4 z"/><circle cx="0" cy="16" r="5"/>
  </g>
  <!-- regle -->
  <g transform="translate(330 268) rotate(-16)">
    <rect x="0" y="0" width="168" height="40" rx="9" fill="#FFB627"
          stroke="#22323b" stroke-width="6"/>
    <g stroke="#22323b" stroke-width="5" stroke-linecap="round">
      <path d="M22 6 v13"/><path d="M50 6 v20"/><path d="M78 6 v13"/>
      <path d="M106 6 v20"/><path d="M134 6 v13"/>
    </g>
  </g>
  <!-- compas -->
  <g transform="translate(96 74)" stroke="#22323b" stroke-width="7"
     stroke-linecap="round" fill="none">
    <path d="M22 4 l-20 78"/><path d="M22 4 l20 78"/>
    <circle cx="22" cy="4" r="7" fill="#8FBE1F"/>
  </g>
</svg>
</div></div><div class="gr"><a class="carte" style="--c:#00778a" href="sciences/index.html"><h2>Sciences</h2><p>Chimie, électricité, mécanique.</p></a></div>
</main>
<footer class="pied"><div class="in"><span>Sciences et mathématiques 1CAP EPC</span><span class="sep">·</span><b>Mme Talbaut</b><span class="sep">·</span><span>LP Max Joséphine, Cayenne</span></div></footer>
</body>
</html>
